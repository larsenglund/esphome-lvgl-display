time:
  - platform: homeassistant
    id: system_time
    on_time_sync:
      - logger.log: "Time synced with Home Assistant!" 
      - if: # Updates the last restart time
          condition:
            lambda: 'return id(device_last_restart).state == "";'
          then:
            - text_sensor.template.publish:
                id: device_last_restart
                state: !lambda 'return id(system_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'
    on_time:
      # - seconds: 0
      #   minutes: $screen_night_minute
      #   hours: $screen_night_hour
      #   then:
      #     - select.set:
      #         id: brightness_mode
      #         option: "Night"
      - seconds: 0
        then:
          - script.execute: time_update

      # Log time every 10 seconds (0, 10, 20, 30, 40, 50)
      - seconds: 0,10,20,30,40,50
        then:
          # - logger.log: "10 second tick!"
          - logger.log:
              format: "Current time is %s"
              args: [ 'id(system_time).now().strftime("%Y-%m-%d %H:%M:%S").c_str()' ]

      # Morning start - 06:30
      - seconds: 0
        minutes: 30
        hours: 6
        then:
          - light.turn_on:
              id: display_backlight
              brightness: ${touchscreen_daytime_brightness}
          - lvgl.resume:
          - lvgl.widget.redraw:
          - logger.log: "Morning period started - display on"
      
      # Morning end - 08:30
      - seconds: 0
        minutes: 30
        hours: 8
        then:
          - light.turn_off: display_backlight
          - delay: 0.5s
          - lvgl.pause:
              show_snow: true
          - logger.log: "Morning period ended - display off"
      
      # Evening start - 16:00
      - seconds: 0
        minutes: 0
        hours: 16
        then:
          - light.turn_on:
              id: display_backlight
              brightness: ${touchscreen_nighttime_brightness}
          - lvgl.resume:
          - lvgl.widget.redraw:
          - logger.log: "Evening period started - display on"
      
      # Evening end - 22:00
      - seconds: 0
        minutes: 0
        hours: 22
        then:
          - light.turn_off: display_backlight
          - delay: 0.5s
          - lvgl.pause:
              show_snow: true
          - logger.log: "Evening period ended - display off"

lvgl:
  on_idle:
    timeout: $touchscreen_idle_timeout
    then:
      - logger.log: "LVGL is idle"
      - if:
          condition:
            lambda: |-
              auto time = id(system_time).now();
              int current_minutes = time.hour * 60 + time.minute;
              
              // Morning: 06:30-08:30
              bool morning_period = (current_minutes >= (6*60+30) && current_minutes < (8*60+30));
              
              return morning_period;
          then:
            # Morning period
            - light.turn_on:
                id: display_backlight
                brightness: ${touchscreen_daytime_brightness}
            - logger.log: "Idle during morning period - day brightness"
          else:
            # Not morning, check if evening
            - if:
                condition:
                  lambda: |-
                    auto time = id(system_time).now();
                    int current_minutes = time.hour * 60 + time.minute;
                    
                    // Evening: 16:00-22:00
                    bool evening_period = (current_minutes >= (16*60+0) && current_minutes < (22*60+0));
                    
                    return evening_period;
                then:
                  # Evening period
                  - light.turn_on:
                      id: display_backlight
                      brightness: ${touchscreen_nighttime_brightness}
                  - logger.log: "Idle during evening period - night brightness"
                else:
                  # Outside both periods
                  - light.turn_off: display_backlight
                  - delay: 0.5s
                  - lvgl.pause:
                      show_snow: true
                  - logger.log: "Idle outside active periods - display off"


# Wake on screen touch
touchscreen:
  on_touch:
    - logger.log: "Screen touched"
    - if:
        condition:
          lvgl.is_paused:
        then:
          # Display is paused/idle, need to wake it
          - lvgl.resume:
          - lvgl.widget.redraw:
          - if:
              condition:
                lambda: |-
                  auto time = id(system_time).now();
                  int current_minutes = time.hour * 60 + time.minute;
                  
                  // Morning: 06:30-08:30
                  bool morning_period = (current_minutes >= (6*60+30) && current_minutes < (8*60+30));
                  
                  return morning_period;
              then:
                # Morning period
                - light.turn_on:
                    id: display_backlight
                    brightness: ${touchscreen_daytime_brightness}
                - logger.log: "Waking display - morning period with day brightness"
              else:
                # Not morning, check if evening
                - if:
                    condition:
                      lambda: |-
                        auto time = id(system_time).now();
                        int current_minutes = time.hour * 60 + time.minute;
                        
                        // Evening: 16:00-22:00
                        bool evening_period = (current_minutes >= (16*60+0) && current_minutes < (22*60+0));
                        
                        return evening_period;
                    then:
                      # Evening period
                      - light.turn_on:
                          id: display_backlight
                          brightness: ${touchscreen_nighttime_brightness}
                      - logger.log: "Waking display - evening period with night brightness"
                    else:
                      # Outside both periods - wake briefly
                      - light.turn_on:
                          id: display_backlight
                          brightness: ${touchscreen_daytime_brightness}
                      - logger.log: "Waking display - outside active periods (temporary)"
        else:
          # Display is already active, just reset idle timer
          - logger.log: "Display already active - interaction registered"

