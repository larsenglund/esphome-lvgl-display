# Extra fonts for the large (2x2) buttons and the light popup. Only include on displays that use them.
font:
  # Mixed case with Swedish letters, for effect names coming from Home Assistant
  - file: "gfonts://Kdam Thmor Pro"
    id: kdam_18
    size: 18
    glyphsets: [GF_Latin_Kernel]
    glyphs: "ÅÄÖåäö"
    ignore_missing_glyphs: true
    bpp: 8

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: material_icons_medium
    size: 28
    glyphs:
      - $mdi_close
      - $mdi_menu_down
      - $mdi_brightness_6
    bpp: 8

  - file: "gfonts://Kdam Thmor Pro"
    id: kdam_32
    size: 32
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ"
    bpp: 8

  - file: "gfonts://Kdam Thmor Pro"
    id: kdam_20
    size: 20
    glyphs: " ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ"
    bpp: 8

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: material_icons_xlarge
    size: 100
    glyphs:
      - $mdi_garage
      - $mdi_garage_open
      - $mdi_garage_alert
    bpp: 8
