---
# Dimmer light button state
# vars:
#   uid: <unique identifer for the switch. Must match the ID of the button>
#   entity_id: <Home Assistant entity_id for the object we are controlling>
globals:
  - id: slider_${uid}_prev_value
    type: int
    restore_value: no
    initial_value: '0'
  - id: slider_${uid}_dragged
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: slider_${uid}_touch_active
    type: bool
    restore_value: no
    initial_value: 'false'

sensor:
  - id: brightness_${uid}
    platform: homeassistant
    entity_id: ${entity_id}
    attribute: brightness
    on_value:
      - logger.log:
          tag: slider
          format: "slider_${uid} hass value is.."
      - logger.log:
          tag: slider
          format: "slider_${uid} hass value in %f"
          args: [ 'x' ]
      - if:
          condition:
            - lambda: 'return !id(slider_${uid}_touch_active);'
          then:
            - lvgl.slider.update:
                id: slider_${uid}
                value: !lambda |-
                  return (isnan(x) ? 0.0 : (x / 2.55));

binary_sensor:
  - id: widget_sensor_${uid}
    platform: homeassistant
    entity_id: ${entity_id}
    trigger_on_initial_state: true
    on_state:
      - logger.log:
          tag: slider
          format: "slider_${uid} state %d"
          args: [ 'x' ]
      - if:
          condition:
            - binary_sensor.is_off: widget_sensor_${uid}
          then:
            - lvgl.slider.update:
                id: slider_${uid}
                value: 0

