            id: button_${uid}
            width: 100
            height: 100
            # x: 130
            # y: 10
            clickable: true
            checkable: true
            styles:
              - square_toggle_style
            on_press:
              then:
                - logger.log:
                    tag: button
                    format: "button_${uid} pressed"
                - homeassistant.service:
                    service: light.toggle
                    data:
                      entity_id: ${entity_id}
            widgets:
              - label:
                  id: icon_${uid}
                  text: ${icon}
                  text_color: icon_off_color
                  text_font: material_icons_large
                  align: TOP_LEFT
                  x: 2
                  y: 4
              - label:
                  id: text_${uid}
                  text: ${text}
                  text_color: 0xFFFFFF
                  text_font: kdam_16
                  align: BOTTOM_LEFT
                  x: 8
                  y: -8