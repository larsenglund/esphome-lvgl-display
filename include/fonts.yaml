font:
  - file: "gfonts://Kdam Thmor Pro"
    id: kdam_26
    size: 26
    glyphs: "0123456789OFN"
    bpp: 8
  
  - file: "gfonts://Kdam Thmor Pro"
    id: kdam_16
    size: 16
    bpp: 8

  - file: "gfonts://Kdam Thmor Pro"
    id: kdam_14
    size: 14
    glyphs: "%"
    bpp: 8
  
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: material_icons_large
    size: 38
    glyphs:
      - $mdi_lightbulb # "\U000F0335"  # lightbulb icon
      - $mdi_test_tube # "\U000F2C2D"  # test tube icon
      - $mdi_candle
      - $mdi_weather_night
      - $mdi_food_variant
      - $mdi_food_croissant
      - $mdi_ceiling_light_multiple
    bpp: 8
  
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: material_icons_small
    size: 14
    glyphs:
      - $mdi_wifi      # "\U000F1EB"  # wifi icon
    bpp: 8

