substitutions:
  device_name: workshop-display
  touchscreen_idle_timeout: "60s"
  touchscreen_daytime_brightness: "80%"
  touchscreen_nighttime_brightness: "50%"

esphome:
  name: ${device_name}
  friendly_name: "Workshop display"

# Time update script - This is run once per second. Use it to update any time related labels.
script:
  - id: time_update
    then:
      - lambda: |-
          auto time = id(system_time).now();
          if (time.is_valid()) {
            // Update time label (HH:MM)
            lv_label_set_text_fmt(id(lbl_time), "%02d:%02d", time.hour, time.minute);
            
            // Update date label (Day DD/MM)
            const char* days[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
            lv_label_set_text_fmt(id(lbl_date), "%s %02d/%02d", 
                                  days[time.day_of_week - 1], 
                                  time.day_of_month, 
                                  time.month);
          }

packages:
  network: !include include/network.yaml # WiFi, API and OTA configuration
  hardware: !include include/guition-esp32-s3-4848s040.yaml # Harware description file
  color: !include include/color.yaml # Color definitions
  fonts: !include include/fonts.yaml # Some nice basic fonts
  glyphs: !include include/mdi_glyph_substitutions.yaml # 1000s of glyphs
  sensors: !include include/sensors_base.yaml # Some basic sensors
  backlight: !include include/time_and_backlight.yaml # Time and backlight management

  slider_1_state: !include
    file: include/dimmer_light_state.yaml
    vars:
      uid: slider_1
      entity_id: "light.esphome_stairs_stair_lights"
  
  slider_2_state: !include
    file: include/dimmer_light_state.yaml
    vars:
      uid: slider_2
      entity_id: "light.staircase_ceiling"

  button_1_state: !include
    file: include/switch_or_light_button_state.yaml
    vars:
      uid: button_1
      entity_id: "light.desk_lights"

logger:
  level: DEBUG

image:
  - file: radial_bg.png
    id: page_background
    resize: 480x480
    type: RGB565

lvgl:
  displays:
    - tft_display
  touchscreens:
    - tft_touch
  color_depth: 16
  
  theme:
    slider:
      bg_color: 0x33294D
      bg_opa: 100%
      outline_width: 2
      outline_color: 0x6750A4
      radius: 8
      pad_all: 0
      indicator:
        bg_color: 0x6750A4
        pad_all: 0
        radius: 0
      knob:
        bg_opa: 0
        border_width: 0
        pad_all: 0

  style_definitions:
    - id: square_toggle_style
      bg_color: 0x33294D
      bg_opa: 100%
      outline_width: 2
      outline_color: 0x6750A4
      border_width: 0
      radius: 8
      pad_all: 0

    - id: momentary_button_style
      bg_color: momentary_button_released_bg
      bg_opa: 100%
      outline_width: 2
      outline_color: momentary_button_released_border
      radius: 8
      pad_all: 0

  top_layer:
    widgets:
      - label:
          text: $mdi_wifi
          text_font: material_icons_small
          id: lbl_hastatus
          hidden: true
          align: top_right
          text_align: right
          text_color: 0xff4800

  pages:
    - id: main_page
      layout:
        type: flex
        flex_flow: ROW_WRAP
        pad_column: 20
        pad_row: 20
      width: 100%
      pad_all: 10
      bg_image_src: page_background
      widgets:
        - slider: !include
            file: include/slider_button.yaml
            vars:
              uid: slider_1
              text: "TRAPP\nSTEG"
              icon: $mdi_lightbulb
              entity_id: "light.esphome_stairs_stair_lights"

        - slider: !include
            file: include/slider_button.yaml
            vars:
              uid: slider_2
              text: "TRAPP\nTAK"
              icon: $mdi_ceiling_light_multiple
              entity_id: "light.staircase_ceiling"

        - obj: !include
            file: include/light_button.yaml
            vars:
              uid: button_1
              text: "DESK"
              icon: $mdi_ceiling_light_multiple
              entity_id: "light.desk_lights"

        - button: !include
            file: include/scene_button.yaml
            vars:
              uid: button_2
              text: "SCENE"
              icon: $mdi_test_tube
              entity_id: "scene.test"

        - obj: !include
            file: include/transparent_empty_button.yaml
            vars:
              uid: button_spacer_1

        - obj: !include
            file: include/transparent_empty_button.yaml
            vars:
              uid: button_spacer_2

        - obj: !include
            file: include/transparent_empty_button.yaml
            vars:
              uid: button_spacer_3

        - obj: !include
            file: include/transparent_empty_button.yaml
            vars:
              uid: button_spacer_4

        - obj: !include
            file: include/time_button.yaml
            vars:
              uid: button_time_1
