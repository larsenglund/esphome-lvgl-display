substitutions:
  device_name: vides-room-display
  touchscreen_idle_timeout: "60s"
  touchscreen_daytime_brightness: "80%"
  touchscreen_nighttime_brightness: "50%"

esphome:
  name: ${device_name}
  friendly_name: "Vides room display"

# Time update script - This is run once per minute. Use it to update any time related labels.
script:
  - id: time_update
    then:
      - lambda: |-
          auto time = id(system_time).now();
          if (time.is_valid()) {
            // Update time label (HH:MM)
            lv_label_set_text_fmt(id(lbl_time), "%02d:%02d", time.hour, time.minute);

            // Update date label (Day DD/MM)
            const char* days[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
            lv_label_set_text_fmt(id(lbl_date), "%s %02d/%02d",
                                  days[time.day_of_week - 1],
                                  time.day_of_month,
                                  time.month);
          }

  # Tint the FÄRG button's palette icon with the shelf's current colour, purple when it is off
  - id: hylla_color_update
    then:
      - lambda: |-
          int r = 0, g = 0, b = 0;
          const auto &rgb = id(hylla_rgb_color).state;
          const size_t start = rgb.find_first_of("0123456789");
          const bool on = id(hylla_on).state;
          lv_color_t color = lv_color_hex(0x6750A4);
          if (on && start != std::string::npos &&
              sscanf(rgb.c_str() + start, "%d, %d, %d", &r, &g, &b) == 3)
            color = lv_color_make(r, g, b);
          lv_obj_set_style_text_color(id(icon_hylla_color), color, LV_PART_MAIN);

packages:
  network: !include include/network.yaml # WiFi, API and OTA configuration
  hardware: !include include/guition-esp32-s3-4848s040.yaml # Harware description file
  color: !include include/color.yaml # Color definitions
  fonts: !include include/fonts.yaml # Some nice basic fonts
  fonts_large: !include include/fonts_large.yaml # Fonts for the large buttons and the popup
  glyphs: !include include/mdi_glyph_substitutions.yaml # 1000s of glyphs
  sensors: !include include/sensors_base.yaml # Some basic sensors
  backlight: !include include/time_and_backlight.yaml # Time and backlight management
  screenshot: !include include/screenshot.yaml # http://vides-room-display.local/screenshot

  slider_hylla_state: !include
    file: include/dimmer_light_state.yaml
    vars:
      uid: slider_hylla
      entity_id: "light.hyllargb"

  hylla_popup: !include
    file: include/light_popup.yaml
    vars:
      uid: hylla
      title: "HYLLA"
      entity_id: "light.hyllargb"

  temp_outdoor_state: !include
    file: include/temperature_state.yaml
    vars:
      uid: temp_outdoor
      entity_id: "sensor.esphome_outdoor_humiture_bme280_temperature"
      entity_id_min: "sensor.esphome_outdoor_humiture_bme280_temperature_min"
      entity_id_max: "sensor.esphome_outdoor_humiture_bme280_temperature_max"

text_sensor:
  # e.g. "(255, 90, 0)"
  - platform: homeassistant
    id: hylla_rgb_color
    entity_id: light.hyllargb
    attribute: rgb_color
    internal: true
    on_value:
      - script.execute: hylla_color_update

binary_sensor:
  - platform: homeassistant
    id: hylla_on
    entity_id: light.hyllargb
    internal: true
    on_state:
      - script.execute: hylla_color_update

# Where a touch on the HYLLA slider started, to tell a long press from a slow drag
globals:
  - id: slider_hylla_press_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: slider_hylla_press_y
    type: int
    restore_value: no
    initial_value: '0'

logger:
  level: DEBUG

image:
  - file: radial_bg.png
    id: page_background
    resize: 480x480
    type: RGB565

lvgl:
  displays:
    - tft_display
  touchscreens:
    - tft_touch
  color_depth: 16

  theme:
    slider:
      bg_color: 0x33294D
      bg_opa: 100%
      outline_width: 2
      outline_color: 0x6750A4
      radius: 8
      pad_all: 0
      indicator:
        bg_color: 0x6750A4
        pad_all: 0
        radius: 0
      knob:
        bg_opa: 0
        border_width: 0
        pad_all: 0

  style_definitions:
    - id: square_toggle_style
      bg_color: 0x33294D
      bg_opa: 100%
      outline_width: 2
      outline_color: 0x6750A4
      border_width: 0
      radius: 8
      pad_all: 0

    - id: momentary_button_style
      bg_color: momentary_button_released_bg
      bg_opa: 100%
      outline_width: 2
      outline_color: momentary_button_released_border
      radius: 8
      pad_all: 0

    # Quick colour buttons on the third row
    - id: color_swatch_style
      bg_opa: 100%
      outline_width: 2
      outline_color: 0x6750A4
      border_width: 0
      shadow_width: 0
      radius: 8
      pad_all: 0

  top_layer:
    widgets:
      - label:
          text: $mdi_wifi
          text_font: material_icons_small
          id: lbl_hastatus
          hidden: true
          align: top_right
          text_align: right
          text_color: 0xff4800

  pages:
    # Same 4x4 raster as the other displays (100px cells, 20px gaps), as a grid so the
    # shelf controls can span 2x2 cells. Widgets fill the next free cell, left to right.
    - id: main_page
      layout:
        type: grid
        grid_rows: [100, 100, 100, 100]
        grid_columns: [100, 100, 100, 100]
        pad_row: 20
        pad_column: 20
      width: 100%
      pad_all: 10
      bg_image_src: page_background
      widgets:
        # Tap toggles, drag dims, long press opens the colour popup
        - slider:
            <<: !include
              file: include/slider_button.yaml
              vars:
                uid: slider_hylla
                text: "HYLLA"
                icon: $mdi_led_strip_variant
                entity_id: "light.hyllargb"
            width: 220
            height: 220
            grid_cell_row_span: 2
            grid_cell_column_span: 2
            on_press:
              - lambda: |-
                  lv_point_t point;
                  lv_indev_get_point(lv_indev_get_act(), &point);
                  id(slider_hylla_press_x) = point.x;
                  id(slider_hylla_press_y) = point.y;
            on_long_press:
              - if:
                  condition:
                    lambda: |-
                      lv_point_t point;
                      lv_indev_get_point(lv_indev_get_act(), &point);
                      return abs(point.x - id(slider_hylla_press_x)) < 12 && abs(point.y - id(slider_hylla_press_y)) < 12;
                  then:
                    - lambda: |-
                        // Ignore the rest of this touch, so the release neither dims nor toggles
                        id(slider_slider_hylla_touch_active) = false;
                        id(slider_slider_hylla_dragged) = false;
                        lv_indev_wait_release(lv_indev_get_act());
                    - script.execute: popup_hylla_open

        # Opens the colour popup
        - button:
            id: button_hylla_color
            width: 220
            height: 220
            grid_cell_row_span: 2
            grid_cell_column_span: 2
            styles:
              - square_toggle_style
            on_click:
              - script.execute: popup_hylla_open
            widgets:
              - label:
                  id: icon_hylla_color
                  text: $mdi_palette
                  text_color: 0x6750A4
                  text_font: material_icons_large
                  align: TOP_LEFT
                  x: 2
                  y: 4
              - label:
                  text: "FÄRG"
                  text_color: 0xFFFFFF
                  text_font: kdam_32
                  align: BOTTOM_LEFT
                  x: 8
                  y: -8

        - button:
            styles:
              - color_swatch_style
            width: 100
            height: 100
            bg_color: 0xFF0000
            on_click:
              - script.execute:
                  id: popup_hylla_set_rgb
                  red: 255
                  green: 0
                  blue: 0

        - button:
            styles:
              - color_swatch_style
            width: 100
            height: 100
            bg_color: 0x00FF00
            on_click:
              - script.execute:
                  id: popup_hylla_set_rgb
                  red: 0
                  green: 255
                  blue: 0

        - button:
            styles:
              - color_swatch_style
            width: 100
            height: 100
            bg_color: 0x0000FF
            on_click:
              - script.execute:
                  id: popup_hylla_set_rgb
                  red: 0
                  green: 0
                  blue: 255

        # White LEDs
        - button:
            styles:
              - color_swatch_style
            width: 100
            height: 100
            bg_color: 0xFFFFFF
            on_click:
              - script.execute: popup_hylla_set_white
            widgets:
              - label:
                  text: "VIT"
                  text_font: kdam_16
                  text_color: 0x221B36
                  align: CENTER

        - obj: !include
            file: include/time_button.yaml
            vars:
              uid: button_time_1

        - obj: !include
            file: include/transparent_empty_button.yaml
            vars:
              uid: button_spacer_1

        - obj: !include
            file: include/transparent_empty_button.yaml
            vars:
              uid: button_spacer_2

        - obj: !include
            file: include/temperature_button.yaml
            vars:
              uid: temp_outdoor
              text: "UTE"
