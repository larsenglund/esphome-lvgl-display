# Vide's room: the Christmas lab, four bubbling tubes that set the shelf lights (HyllaRGB)
substitutions:
  device_name: vides-room-display
  friendly_name: "Vides room display"
  touchscreen_idle_timeout: "60s"
  touchscreen_daytime_brightness: "80%"
  touchscreen_nighttime_brightness: "50%"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

packages:
  network: !include include/network.yaml # WiFi, API and OTA configuration
  hardware: !include include/guition-esp32-s3-4848s040.yaml # Harware description file
  fonts: !include include/fonts.yaml # Some nice basic fonts
  glyphs: !include include/mdi_glyph_substitutions.yaml # 1000s of glyphs
  sensors: !include include/sensors_base.yaml # Some basic sensors
  backlight: !include include/time_and_backlight.yaml # Time and backlight management
  screenshot: !include include/screenshot.yaml # http://vides-room-display.local/screenshot

  temp_outdoor_state: !include
    file: include/temperature_state.yaml
    vars:
      uid: temp_outdoor
      entity_id: "sensor.esphome_outdoor_humiture_bme280_temperature"
      entity_id_min: "sensor.esphome_outdoor_humiture_bme280_temperature_min"
      entity_id_max: "sensor.esphome_outdoor_humiture_bme280_temperature_max"

  lab: !include
    file: lab/lab.yaml
    vars:
      lab_light: "light.hyllargb"

logger:
  level: DEBUG
